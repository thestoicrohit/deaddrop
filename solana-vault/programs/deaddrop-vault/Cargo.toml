[package]
name = "deaddrop-vault"
version = "0.1.0"
description = "DeadDrop digital legacy vault — Solana port of DeadDropVault.sol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "deaddrop_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
